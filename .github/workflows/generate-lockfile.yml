# ONE-TIME helper. Creates package-lock.json (needed by `npm ci` and the npm cache)
# for people without Node.js on their computer. Run it once from the Actions tab
# (Run workflow), then delete this file. It never runs on push or pull_request.
name: Generate package-lock (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "Add package-lock.json" && git push)
